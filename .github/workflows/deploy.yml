name: Website publiceren

# Publiceert de website vanuit de map public/ naar GitHub Pages.
# De map public/ blijft de enige bron: wat hier staat, staat live.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceren:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: Bestanden verzamelen
        run: |
          mkdir -p _site
          cp -R public/. _site/
          touch _site/.nojekyll

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
